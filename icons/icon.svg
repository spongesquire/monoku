<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Monoku home-screen icon: warm paper, ink grid, rust center cell -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#efece2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#paper)"/>
  <g>
    <rect x="96"  y="96"  width="88" height="88" rx="18" fill="#23211c"/>
    <rect x="212" y="96"  width="88" height="88" rx="18" fill="#faf8f2" stroke="#b7b1a2" stroke-width="10"/>
    <rect x="328" y="96"  width="88" height="88" rx="18" fill="#23211c"/>
    <rect x="96"  y="212" width="88" height="88" rx="18" fill="#faf8f2" stroke="#b7b1a2" stroke-width="10"/>
    <rect x="212" y="212" width="88" height="88" rx="18" fill="#c2440d"/>
    <rect x="328" y="212" width="88" height="88" rx="18" fill="#faf8f2" stroke="#b7b1a2" stroke-width="10"/>
    <rect x="96"  y="328" width="88" height="88" rx="18" fill="#faf8f2" stroke="#b7b1a2" stroke-width="10"/>
    <rect x="212" y="328" width="88" height="88" rx="18" fill="#23211c"/>
    <rect x="328" y="328" width="88" height="88" rx="18" fill="#23211c"/>
    <!-- the solving digit in the selected cell -->
    <text x="256" y="256" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
          font-size="64" font-weight="700" fill="#faf8f2" text-anchor="middle" dominant-baseline="central">1</text>
  </g>
</svg>
